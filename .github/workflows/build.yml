name: build-and-package

# Verifiable WDK build pipeline.
#
# Produces, for every push/PR, an UNSIGNED but submission-ready driver package
# (.sys/.inf/.cat + a .cab) together with SHA-256 hashes and - on master/tags -
# a cryptographic build-provenance attestation linking each binary to its exact
# source commit. That provenance + reproducibility is what OSSign / Microsoft
# attestation signing require before they will sign the driver. See BUILDING.md.

on:
  workflow_dispatch:
  # release.yml builds through this workflow, so a release is made of exactly
  # what a normal CI run produces.
  workflow_call:
  push:
    branches: [master, vnext]
    tags: ["v*"]
  # Every PR, including ones stacked on other PR branches or on vnext.
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  # Keep in lockstep with the defaults in tools/Install-WdkBuildEnv.ps1.
  SDK_VERSION: "10.0.22621.0"

jobs:
  # ---------------------------------------------------------------------------
  # Kernel driver (driver/, Rust): needs the WDK, a Rust toolchain and a
  # libclang for bindgen on the runner. ARM64 is intentionally omitted for
  # now: the INF has no ARM64 models section yet, so Inf2Cat cannot package
  # it (see BUILDING.md).
  # ---------------------------------------------------------------------------
  driver:
    name: driver (${{ matrix.platform }})
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.numeric }}
    permissions:
      contents: read
      id-token: write      # required by attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the whole history, for the version and build label

      - name: Install WDK build environment
        shell: pwsh
        run: ./tools/Install-WdkBuildEnv.ps1 -SdkVersion "${{ env.SDK_VERSION }}"

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          # VERSION holds the release version (major.minor.patch). The fourth
          # field is the number of commits in the history, which tells builds
          # of one version apart and is the same whichever workflow builds a
          # commit.
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be major.minor.patch, got '$base'" }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and
              $env:GITHUB_REF_NAME -notmatch "^v$([regex]::Escape($base))(-.+)?$") {
            throw "tag $env:GITHUB_REF_NAME doesn't match VERSION ($base)"
          }
          $desc = (& git describe --tags --always --dirty 2>$null)
          if (-not $desc) { $desc = "$base-$(& git rev-parse --short HEAD)" }
          $numeric = "$base.$(& git rev-list --count HEAD)"
          "describe=$desc"   | Out-File $env:GITHUB_OUTPUT -Append
          "numeric=$numeric" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version: $desc  (DriverVer numeric: $numeric)"

      - name: Install the pinned Rust toolchain
        shell: pwsh
        working-directory: driver
        run: |
          # driver/rust-toolchain.toml names the compiler. With no arguments
          # rustup installs the toolchain that file selects.
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed (exit $LASTEXITCODE)" }
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Test the driver's kernel-independent logic
        shell: pwsh
        working-directory: driver
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed (exit $LASTEXITCODE)" }

      - name: Build driver
        shell: pwsh
        working-directory: driver
        run: |
          # Microsoft's WDK crates take the newest SDK folder unless told
          # otherwise, and the image's newest plain SDK can come without the
          # kernel headers. Pick the highest version that has them
          # (km\ntifs.h): the matching kernel import libraries are then
          # present too.
          $inc = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $sdk = (Get-ChildItem $inc -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') } |
                  Sort-Object { [version]$_.Name } -Descending |
                  Select-Object -First 1).Name
          if (-not $sdk) { throw "No SDK carrying WDK kernel headers (km\ntifs.h) under $inc" }
          Write-Host "Using Windows SDK+WDK: $sdk"
          $env:Version_Number = $sdk

          # bindgen needs a libclang.dll.
          if (-not $env:LIBCLANG_PATH) {
            $candidates = @("$env:ProgramFiles\LLVM\bin") +
              @(Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\Llvm\x64\bin" `
                  -Directory -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $env:LIBCLANG_PATH = $candidates |
              Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
            if (-not $env:LIBCLANG_PATH) { throw 'libclang.dll not found; set LIBCLANG_PATH' }
          }
          Write-Host "Using libclang from: $env:LIBCLANG_PATH"

          # The image is left unsigned for attestation signing.
          $triple = '${{ matrix.platform == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}'
          cargo build --locked --release --target $triple -p sar-driver
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed (exit $LASTEXITCODE)" }

      - name: Package + hash
        shell: pwsh
        run: |
          ./tools/Package-SarDriver.ps1 `
            -Platform ${{ matrix.platform }} `
            -Configuration Release `
            -DriverVersion ${{ steps.ver.outputs.numeric }} `
            -Describe "${{ steps.ver.outputs.describe }}"

      - name: Test-sign package
        shell: pwsh
        run: |
          # A second copy of the package signed with a throwaway self-signed
          # certificate, for test machines with test signing enabled. The
          # certificate (.cer) ships alongside so the guest can trust it.
          $plat = "${{ matrix.platform }}"
          $stage = "artifacts/$plat"
          $signed = "artifacts/$plat-testsigned"
          New-Item -ItemType Directory -Force -Path $signed | Out-Null
          # The .pdb is for reading crash dumps from test machines.
          foreach ($ext in 'sys', 'inf', 'cat', 'pdb') {
            Copy-Item "$stage/SynchronousAudioRouter.$ext" $signed -Force
          }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=SAR CI test signing' `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(2)
          Export-Certificate -Cert $cert -FilePath "$signed/testsign.cer" | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My `
            "$signed/SynchronousAudioRouter.sys" "$signed/SynchronousAudioRouter.cat"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)" }
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          # The check the release workflow makes on the driver Microsoft
          # signs, run here on the test-signed copy so it is exercised.
          ./tools/Test-SarSignedDriver.ps1 `
            -Unsigned "$stage/SynchronousAudioRouter.sys" -Signed "$signed/SynchronousAudioRouter.sys"
          $lines = Get-ChildItem $signed -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
                   Get-FileHash -Algorithm SHA256 |
                   ForEach-Object { '{0}  {1}' -f $_.Hash, (Split-Path $_.Path -Leaf) }
          $lines | Out-File "$signed/SHA256SUMS.txt" -Encoding ascii
          @"
          TEST-SIGNED package: only loads on machines with test signing enabled
          (bcdedit /set testsigning on) that trust testsign.cer in both the Root and
          TrustedPublisher stores. Not for distribution.
          "@ | Out-File "$signed/README.txt" -Encoding ascii

      - name: Upload test-signed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sar-driver-${{ matrix.platform }}-testsigned
          path: artifacts/${{ matrix.platform }}-testsigned/
          if-no-files-found: error

      - name: Attest build provenance
        if: github.event_name != 'pull_request'   # OIDC token isn't writable on fork PRs
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: artifacts/${{ matrix.platform }}/SynchronousAudioRouter.sys

      - name: Upload driver package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sar-driver-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # User-mode ASIO plugin: plain MSVC, no WDK. 32-bit (Win32) is still built
  # because 32-bit DAWs need a 32-bit ASIO DLL.
  # ---------------------------------------------------------------------------
  usermode:
    name: usermode (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        with:
          vs-version: "[17.0,18.0)"

      - name: Build user-mode projects
        shell: pwsh
        run: |
          & msbuild SynchronousAudioRouter.sln `
              '/t:SarAsio;SarConfigure;SarCtl;SarTest;SarTestClock' `
              /p:Configuration=Release `
              /p:Platform=${{ matrix.platform }} `
              /m /verbosity:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed (exit $LASTEXITCODE)" }

      - name: Collect + hash
        shell: pwsh
        run: |
          $plat = "${{ matrix.platform }}"
          $stage = "artifacts/$plat"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($name in 'SarAsio.dll', 'SarConfigure.exe', 'SarTest.exe', 'SarTestClock.dll') {
            $file = Get-ChildItem -Recurse -Filter $name |
                    Where-Object { $_.FullName -match "\\Release\\" } |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $file) { throw "$name not found - did the build succeed?" }
            Copy-Item $file.FullName $stage -Force
          }
          # Symbols, for reading crash dumps from test machines.
          foreach ($name in 'SarAsio.pdb', 'SarTest.pdb', 'SarTestClock.pdb') {
            $file = Get-ChildItem -Recurse -Filter $name |
                    Where-Object { $_.FullName -match "\\Release\\" } |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($file) { Copy-Item $file.FullName $stage -Force } else { Write-Warning "$name not found" }
          }
          New-Item -ItemType Directory -Force -Path "$stage/test" | Out-Null
          Copy-Item tools/test/* "$stage/test" -Force
          # Materialize the hash lines into a variable BEFORE opening the output
          # file, and skip the sums file itself - otherwise the same pipeline both
          # reads and writes SHA256SUMS.txt and Get-FileHash hits a file lock.
          $lines = Get-ChildItem $stage -File |
                   Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
                   Get-FileHash -Algorithm SHA256 |
                   ForEach-Object { '{0}  {1}' -f $_.Hash, (Split-Path $_.Path -Leaf) }
          $lines | Out-File "$stage/SHA256SUMS.txt" -Encoding ascii

      - name: Upload SarAsio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sar-asio-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # MSI installer around the TEST-SIGNED driver, for manual testing on machines
  # with test signing enabled. A release MSI needs the attestation-signed
  # driver instead; that comes after signing, not from this job.
  # ---------------------------------------------------------------------------
  installer:
    name: installer (x64, test-signed)
    needs: [driver, usermode]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        with:
          vs-version: "[17.0,18.0)"

      - name: Download test-signed driver
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sar-driver-x64-testsigned
          path: stage/driver

      - name: Download SarAsio (x64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sar-asio-x64
          path: stage/x64

      - name: Download SarAsio (x86)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sar-asio-x86
          path: stage/x86

      - name: Build MSI
        shell: pwsh
        run: |
          # The driver's version. MSI versions compare major.minor.build
          # only; the fourth field just labels the build (same-version
          # upgrades are on).
          $version = "${{ needs.driver.outputs.version }}"
          $out = 'artifacts/installer-x64-testsigned'
          ./tools/Build-SarInstaller.ps1 -Actions -Msi `
            -DriverDir stage/driver -Bin64 stage/x64 -Bin32 stage/x86 -Version $version `
            -OutFile "$out/SynchronousAudioRouter-$version-x64-testsigned.msi"
          Copy-Item stage/driver/testsign.cer $out
          $lines = Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 |
                   ForEach-Object { '{0}  {1}' -f $_.Hash, (Split-Path $_.Path -Leaf) }
          $lines | Out-File "$out/SHA256SUMS.txt" -Encoding ascii
          @"
          TEST-SIGNED installer: the driver inside only loads with test signing on.
          Not for distribution. On the test machine, as administrator:

            bcdedit /set testsigning on      (then reboot; Secure Boot must be off)
            certutil -addstore Root testsign.cer
            certutil -addstore TrustedPublisher testsign.cer
            msiexec /i SynchronousAudioRouter-$version-x64-testsigned.msi

          Every CI run signs with a fresh certificate, so trust this run's
          testsign.cer before installing this run's MSI.
          "@ | Out-File "$out/README.txt" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sar-installer-x64-testsigned
          path: artifacts/installer-x64-testsigned/
          if-no-files-found: error
